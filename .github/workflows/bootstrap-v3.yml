name: Bootstrap Market Intelligence V3 Data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-v3.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests before data refresh
        run: |
          python -m unittest discover -p "test_*.py" -v
          node --test test_*.mjs

      - name: Refresh market snapshots
        run: python update_market_prices.py

      - name: Refresh political events
        run: python update_political_events.py

      - name: Refresh India macro calendar
        run: python macro_sources.py

      - name: Refresh India exchange calendar
        run: python india_exchange_events.py

      - name: Refresh historical market impact
        run: python analyze_market_impact.py

      - name: Validate bootstrapped data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          events=json.loads(Path('events.json').read_text())
          prices=json.loads(Path('market-prices.json').read_text())
          impact=json.loads(Path('market-impact.json').read_text())
          status=json.loads(Path('source-status.json').read_text())

          ids={e.get('id') for e in events}
          assert 'us-federal-general-election-2026' in ids, '3 Nov 2026 US federal election missing'
          india_elections=status.get('sources',{}).get('india_elections',{})
          assert india_elections.get('status') in {'ok','error'}, 'India election source health missing'
          required={'nifty','banknifty','sensex','gift_nifty','usdinr','sp500','nasdaq','gold','bitcoin'}
          keys={x.get('key') for x in prices.get('instruments',[])}
          assert required <= keys, f'Missing instruments: {required-keys}'
          assert 'eventTypes' in impact
          assert len(events) > 0
          print('Events:',len(events))
          print('India election source:',india_elections)
          print('Price instruments:',len(prices.get('instruments',[])))
          print('Historical event types:',len(impact.get('eventTypes',{})))
          print('Sources:',len(status.get('sources',{})))
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- events.json source-status.json political_events.json market-prices.json market-impact.json; then
            echo "No bootstrap data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json source-status.json political_events.json market-prices.json market-impact.json
          git commit -m "chore: bootstrap market intelligence v3 data"
          git push
