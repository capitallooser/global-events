name: Analyze Historical Market Impact

on:
  schedule:
    # Once daily after the final event/market enrichment run.
    - cron: "45 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test historical analysis
        run: python -m unittest test_market_impact.py -v

      - name: Build expanded historical reaction statistics
        run: python analyze_market_impact.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("market-impact.json")
          assert path.exists(), "market-impact.json was not generated"
          data = json.loads(path.read_text())
          assert "updatedAt" in data
          assert "eventTypes" in data
          expected={"nifty","banknifty","sensex","sp500","nasdaq","gold","usdinr","bitcoin"}
          assert expected <= set(data.get("benchmarks",{})), f"Missing benchmark metadata: {expected-set(data.get('benchmarks',{}))}"
          print("Event types analyzed:", len(data["eventTypes"]))
          for key, row in data["eventTypes"].items():
              assert row["impactLevel"] in {"very_high", "high", "medium", "low", "no_history"}
          PY

      - name: Commit changed analysis
        run: |
          if git diff --quiet -- market-impact.json; then
            echo "No historical analysis changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-impact.json
          git commit -m "chore: update historical market impact"
          git push
