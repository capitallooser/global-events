name: Refresh Market Prices

on:
  schedule:
    # 08:05, 11:05, 14:05, 15:05, 20:05, 22:05 IST
    - cron: "35 2 * * *"
    - cron: "35 5 * * *"
    - cron: "35 8 * * *"
    - cron: "35 9 * * *"
    - cron: "35 14 * * *"
    - cron: "35 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test market price normalizer
        run: python -m unittest test_market_prices.py -v
      - name: Refresh free market snapshots
        run: python update_market_prices.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('market-prices.json').read_text())
          required={'nifty','banknifty','sensex','gift_nifty','usdinr','sp500','nasdaq','gold','bitcoin'}
          keys={x['key'] for x in data.get('instruments',[])}
          assert required <= keys, f'Missing instruments: {required-keys}'
          for row in data['instruments']:
              assert row['status'] in {'Live','Delayed','Last available','Unavailable'}
          print('Validated market snapshots:',len(data['instruments']))
          PY
      - name: Commit changed market snapshot
        run: |
          if git diff --quiet -- market-prices.json; then
            echo "No market snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-prices.json
          git commit -m "chore: refresh market snapshots"
          git push
