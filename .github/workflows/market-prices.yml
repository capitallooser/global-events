name: Refresh Market Prices

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test market price normalizer
        run: python -m unittest test_market_prices.py -v
      - name: Refresh free market snapshots
        run: python update_market_prices.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('market-prices.json').read_text())
          required={'nifty','banknifty','sensex','usdinr','sp500','nasdaq','gold','crude','bitcoin'}
          keys={x['key'] for x in data.get('instruments',[])}
          assert required <= keys, f'Missing instruments: {required-keys}'
          assert 'gift_nifty' not in keys, 'GIFT Nifty must not be present'
          for row in data['instruments']:
              assert row['status'] in {'Live','Delayed','Last available','Unavailable'}
          print('Validated market snapshots:',len(data['instruments']))
          PY
      - name: Commit changed market snapshot
        run: |
          if git diff --quiet -- market-prices.json; then
            echo "No market snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-prices.json
          git commit -m "chore: refresh market snapshots"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
